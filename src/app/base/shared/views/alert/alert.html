<h3 mat-dialog-title  cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle class="text-center" [class]="alertOptions.headerClass">
    <mat-icon class="alert-icon">{{alertOptions.icon}}</mat-icon>
</h3>
<mat-dialog-content class="mat-typography text-center">
  <h3 [class]="alertOptions.titleClass">{{alertOptions.title}}</h3>
  <ul class="text-start">
  @for (m of messages; track $index) {
    <li  [class]="alertOptions.messagesClass" [innerHTML]="m">  </li>
  }
  </ul>
</mat-dialog-content>

<mat-dialog-actions class="d-flex justify-content-around">
  @if(alertOptions.cancelShow){
    <!-- <button mat-raised-button mat-dialog-close color="tertiary">{{alertOptions.cancelText}}</button> -->
    <button mat-raised-button (click)="onNoClick()" color="tertiary">{{alertOptions.cancelText}}</button>
  }

  <!-- @if(alertOptions.duration>0){
    <mat-progress-bar mode="determinate" [value]="tiempoRestante"></mat-progress-bar>
  } -->
  <!-- <button mat-raised-button [mat-dialog-close]="true" cdkFocusInitial color="accent">{{alertOptions.OKText}}</button> -->
  <button mat-raised-button (click)="OnOKClick()" cdkFocusInitial color="accent">{{alertOptions.OKText}}</button>
</mat-dialog-actions>
