<h3 mat-dialog-title  cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle class="bg-danger text-center text-white">
  CONFIRMAR
</h3>
<mat-dialog-content class="mat-typography">
    Esta Seguro de eliminar el registro
</mat-dialog-content>

<mat-dialog-actions class="d-flex justify-content-around">

</mat-dialog-actions>
