<form autocomplete="off" (ngSubmit)="submit(f)" #f="ngForm" appPreventEnterSubmit appAnimarPerderFoco [dialogRef]="dialogRef">

    <h1 mat-dialog-title cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle class="text-bg-dark dialog-header">
      ROLES
      <button mat-icon-button mat-dialog-close>
        <mat-icon style="color:white">close</mat-icon>
      </button>
    </h1>

    <mat-dialog-content class="mat-typography row row-cols-1 row-cols-md-2 px-0 pt-2">
        <mat-form-field class="col">
            <mat-label>Código</mat-label>
            <input matInput placeholder="" [(ngModel)]="rol.codigo" name="codigo" #txtCodigo (keydown.enter)="txtNombre.focus()">
        </mat-form-field>

        <mat-form-field class="col">
            <mat-label>Nombre</mat-label>
            <input matInput placeholder="" [(ngModel)]="rol.nombre" name="nombre" #txtNombre (keydown.enter)="txtDescripcion.focus()" required cdkFocusInitial>
        </mat-form-field>

        <mat-form-field class="col">
            <mat-label>Descripción</mat-label>
            <input matInput placeholder="" [(ngModel)]="rol.descripcion" name="descripcion" #txtDescripcion>
        </mat-form-field>


    </mat-dialog-content>

    <mat-dialog-actions class="d-flex justify-content-around bg-light">
        <button mat-raised-button mat-dialog-close class="bg-primary text-white">Cancelar</button>
        <button mat-raised-button type="submit" class="bg-success text-black" appBotonGuardar [form]="f"><mat-icon class="d-none"><mat-spinner  diameter="18"></mat-spinner> </mat-icon> Guardar </button>
    </mat-dialog-actions>

</form>
