<form autocomplete="off" (ngSubmit)="submit(f)" #f="ngForm" appPreventEnterSubmit appAnimarPerderFoco [dialogRef]="dialogRef">

    <h1 mat-dialog-title cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle class="text-bg-dark dialog-header">
      PERMISOS
      <button mat-icon-button mat-dialog-close>
        <mat-icon style="color:white">close</mat-icon>
      </button>
    </h1>

    <mat-dialog-content class="mat-typography row row-cols-1 row-cols-md-2 px-0 pt-2">
        <mat-form-field class="col">
            <mat-label>Nombre</mat-label>
            <input matInput placeholder="" [(ngModel)]="permiso.nombre" name="nombre" required>
        </mat-form-field>

        <mat-form-field class="col">
            <mat-label>Descripción</mat-label>
            <input matInput placeholder="" [(ngModel)]="permiso.descripcion" name="descripcion" required>
        </mat-form-field>

        <mat-form-field class="col">
            <mat-label>Ruta nombre</mat-label>
            <input matInput placeholder="" [(ngModel)]="permiso.ruta_nombre" name="ruta_nombre" required>
        </mat-form-field>

        <mat-form-field class="col">
            <mat-label>Módulo</mat-label>
            <mat-select placeholder="" [(ngModel)]="permiso.modulo_id" name="modulo_id" required>
                @for (x of modulos;track $index) {
                    <mat-option [value]="x.id">{{x.nombre}}</mat-option>
                }
            </mat-select>
        </mat-form-field>

        <mat-form-field class="col">
            <mat-label>Tipo Permiso</mat-label>
            <mat-select placeholder="" [(ngModel)]="permiso.tipo_permiso_id" name="tipo_permiso_id" required>
                @for (x of tipoPermisos;track $index) {
                    <mat-option [value]="x.id">{{x.nombre}}</mat-option>
                }
            </mat-select>
        </mat-form-field>
    </mat-dialog-content>

    <mat-dialog-actions class="d-flex justify-content-around bg-light">
        <button mat-raised-button mat-dialog-close class="bg-primary text-white">Cancelar</button>
        <button mat-raised-button type="submit" class="bg-success text-black" appBotonGuardar [form]="f"><mat-icon class="d-none"><mat-spinner  diameter="18"></mat-spinner> </mat-icon> Guardar </button>
    </mat-dialog-actions>

</form>
