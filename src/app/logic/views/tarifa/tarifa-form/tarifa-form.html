<form autocomplete="off" (ngSubmit)="submit(f)" #f="ngForm" appPreventEnterSubmit appAnimarPerderFoco [dialogRef]="dialogRef">
    <h1 mat-dialog-title cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle class="text-bg-dark dialog-header">
      TARIFAS
      <button mat-icon-button mat-dialog-close type="button">
        <mat-icon style="color:white">close</mat-icon>
      </button>
    </h1>

    <mat-dialog-content class="mat-typography px-3 pt-2 pb-1">

        <!-- CARD 1: DATOS DE LA TARIFA -->
        <div class="form-section-card">
            <div class="section-header">
                <mat-icon class="section-icon">price_change</mat-icon>
                <span class="section-title">Datos de la Tarifa</span>
            </div>
            <div class="row row-cols-1 row-cols-md-2 g-2">
                
                <!-- COLUMNA 1: SERVICIO -->
                <div class="col">
                    <div class="field-top-bar">
                        <label class="field-custom-label">Servicio <span class="text-danger">*</span></label>
                        <button type="button" class="btn-tool btn-tool-manage" (click)="abrirModalServicio()" matTooltip="Gestionar servicios (Adicionar, Modificar, Eliminar)">
                            <mat-icon>format_list_bulleted</mat-icon>
                        </button>
                    </div>
                    <app-select-search
                        #cboServicio
                        (keyupEnter)="cboTipoHospedaje.focus()"
                        label="Seleccione Servicio"
                        placeholder="Buscar servicio..."
                        [(ngModel)]="tarifa.servicio_id"
                        [dataSource]="servicios"
                        text="descripcion"
                        value="id"
                        name="servicio_id"
                        required
                        [searchFields]="['descripcion']">
                    </app-select-search>
                </div>

                <!-- COLUMNA 2: TIPO HOSPEDAJE -->
                <div class="col">
                    <div class="field-top-bar">
                        <label class="field-custom-label">Tipo Hospedaje <span class="text-danger">*</span></label>
                    </div>
                    <app-select-search
                        #cboTipoHospedaje
                        (keyupEnter)="cboPaquete.focus()"
                        label="Seleccione Tipo Hospedaje"
                        placeholder="Buscar tipo hospedaje..."
                        [(ngModel)]="tarifa.tipo_hospedaje_id"
                        [dataSource]="tiposHospedaje"
                        text="descripcion"
                        value="id"
                        name="tipo_hospedaje_id"
                        required
                        [searchFields]="['descripcion']">
                    </app-select-search>
                </div>

                <!-- COLUMNA 3: PAQUETE -->
                <div class="col">
                    <div class="field-top-bar">
                        <label class="field-custom-label">Paquete <span class="text-danger">*</span></label>
                        <button type="button" class="btn-tool btn-tool-manage" (click)="abrirModalPaquete()" matTooltip="Gestionar paquetes (Adicionar, Modificar, Eliminar)">
                            <mat-icon>format_list_bulleted</mat-icon>
                        </button>
                    </div>
                    <app-select-search
                        #cboPaquete
                        (keyupEnter)="txtComida.focus()"
                        label="Seleccione Paquete"
                        placeholder="Buscar paquete..."
                        [(ngModel)]="tarifa.paquete_id"
                        [dataSource]="paquetes"
                        text="descripcion"
                        value="id"
                        name="paquete_id"
                        required
                        [searchFields]="['descripcion']">
                    </app-select-search>
                </div>

                <!-- COLUMNA 4: COMIDA INCLUIDA -->
                <div class="col">
                    <div class="field-top-bar">
                        <label class="field-custom-label">Comida Incluida</label>
                    </div>
                    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-100">
                        <input matInput placeholder="Ej: 4 Comidas, Desayuno Buffet, etc." [(ngModel)]="tarifa.comida_incluida" name="comida_incluida" #txtComida (keydown.enter)="txtTarifaAdulto.focus()">
                        <mat-icon matSuffix>restaurant</mat-icon>
                    </mat-form-field>
                </div>

            </div>
        </div>

        <!-- CARD 2: PRECIOS -->
        <div class="form-section-card">
            <div class="section-header">
                <mat-icon class="section-icon">payments</mat-icon>
                <span class="section-title">Precios</span>
            </div>
            <div class="row row-cols-1 row-cols-md-2 g-2">
                <mat-form-field class="col" appearance="outline" subscriptSizing="dynamic">
                    <mat-label>Tarifa Adulto (Bs.)</mat-label>
                    <input type="number" step="0.01" min="0" matInput placeholder="0.00" [(ngModel)]="tarifa.tarifa_adulto" name="tarifa_adulto" #txtTarifaAdulto (keydown.enter)="txtTarifaNinio.focus()" required>
                    <mat-icon matSuffix style="color: #1b5e20;">payments</mat-icon>
                </mat-form-field>

                <mat-form-field class="col" appearance="outline" subscriptSizing="dynamic">
                    <mat-label>Tarifa Niño (Bs.)</mat-label>
                    <input type="number" step="0.01" min="0" matInput placeholder="0.00" [(ngModel)]="tarifa.tarifa_ninio" name="tarifa_ninio" #txtTarifaNinio>
                    <mat-icon matSuffix style="color: #e65100;">payments</mat-icon>
                </mat-form-field>
            </div>
        </div>

        <!-- CARD 3: DETALLE / OBSERVACIONES -->
        <div class="form-section-card mb-1">
            <div class="section-header">
                <mat-icon class="section-icon">description</mat-icon>
                <span class="section-title">Detalle / Observaciones</span>
            </div>
            <mat-form-field class="w-100" appearance="outline" subscriptSizing="dynamic">
                <mat-label>Detalle adicional de la tarifa</mat-label>
                <textarea matInput rows="2" placeholder="Observaciones o aclaraciones de la tarifa..." [(ngModel)]="tarifa.detalle" name="detalle"></textarea>
            </mat-form-field>
        </div>

    </mat-dialog-content>

    <mat-dialog-actions class="d-flex justify-content-around bg-light">
        <button mat-raised-button mat-dialog-close class="bg-primary text-white">Cancelar</button>
        <button mat-raised-button type="submit" class="bg-success text-black" appBotonGuardar [form]="f"><mat-icon class="d-none"><mat-spinner diameter="18"></mat-spinner> </mat-icon> Guardar </button>
    </mat-dialog-actions>
</form>
