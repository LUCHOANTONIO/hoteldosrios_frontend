<form autocomplete="off" (ngSubmit)="submit(f)" #f="ngForm" appPreventEnterSubmit>
    <!-- <h1 mat-dialog-title cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle class="bg-dark text-white p-1">CLIENTES</h1> -->

    <h1 mat-dialog-title cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle class="text-bg-dark dialog-header">
      TIPO HABITACIONES
      <button mat-icon-button mat-dialog-close>
        <mat-icon style="color:white">close</mat-icon>
      </button>
    </h1>

    <mat-dialog-content class="mat-typography row row-cols-1 row-cols-md-2 px-0 pt-2">
       
        <mat-form-field class="col">
            <mat-label>Codigo :</mat-label>
            <input matInput placeholder="" [(ngModel)]="tipo_habitacion.codigo" name="codigo" #Nombre (keydown.enter)="txtDescripcion.focus()" required>           
        </mat-form-field>

        <mat-form-field class="col">
            <mat-label>Tipo Habitacion :</mat-label>
            <input matInput placeholder="" [(ngModel)]="tipo_habitacion.descripcion" name="descripcion" #txtDescripcion required>           
        </mat-form-field>   
               
        <!-- <mat-form-field class="col">
            <mat-label>Selecciona un color</mat-label>
            <input matInput type="color" [(ngModel)]="tipo_habitacion.color" name="color">
        </mat-form-field> -->

    </mat-dialog-content>

    <mat-dialog-actions class="d-flex justify-content-around bg-light">
        <button mat-raised-button mat-dialog-close class="bg-primary text-white">Cancelar</button>
        <button mat-raised-button type="submit" class="bg-success text-black" appBotonGuardar [form]="f"><mat-icon class="d-none"><mat-spinner  diameter="18"></mat-spinner> </mat-icon> Guardar </button>
    </mat-dialog-actions>
</form>
