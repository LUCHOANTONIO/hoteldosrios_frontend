<mat-card class="my-1" appearance="outlined">
  <mat-card-header class="bg-light my-1" style="padding: 5px; display: flex; align-items: center;">
    <div style="display: flex; align-items: center; flex: 1;">
      <mat-card-title class="text-bg-white pt-1" style="font-size: 18px; font-weight: bold;">
        INVENTARIO DE ALMACEN
      </mat-card-title>
    </div>

    <mat-form-field appearance="outline" subscriptSizing="dynamic" style="margin-left: auto;">
      <mat-label class="text-bg-light" style="font-size: 14px;">Texto búsqueda</mat-label>
      <input
        matInput
        type="search"
        class="text-bg-light"
        placeholder=""
        (keydown.enter)="busqueda(txtBusqueda.value)"
        #txtBusqueda
      />
      <button mat-icon-button matSuffix class="text-info" (click)="busqueda(txtBusqueda.value)" style="padding: 0;">
        <mat-icon>search</mat-icon>
      </button>
    </mat-form-field>
  </mat-card-header>

  <mat-card-content class="bg-white p-0">
    <div class="mat-elevation-z8">
      <div class="table-responsive">
        <table mat-table [dataSource]="dataSource">
          <tr *matNoDataRow>
            <td [attr.colspan]="displayedColumns.length" class="text-center" style="font-size:18px;">
              No hay datos disponibles
            </td>
          </tr>

          <ng-container matColumnDef="sku">
            <th mat-header-cell *matHeaderCellDef>Código</th>
            <td mat-cell *matCellDef="let x">{{ x.sku }}</td>
          </ng-container>

          <ng-container matColumnDef="categoria_nombre">
            <th mat-header-cell *matHeaderCellDef>Categoría</th>
            <td mat-cell *matCellDef="let x">{{ x.categoria_nombre }}</td>
          </ng-container>

          <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef>Producto</th>
            <td mat-cell *matCellDef="let x">{{ x.nombre }}</td>
          </ng-container>

          <ng-container matColumnDef="ultimo_costo">
            <th mat-header-cell *matHeaderCellDef>Costo Compra</th>
            <td mat-cell *matCellDef="let x">
              <div style="display: flex; align-items: center;">
                {{ x.ultimo_costo | number:'1.2-2' }}
                <mat-icon style="margin-left: 8px;" class="text-primary">money</mat-icon>
              </div>
            </td>
          </ng-container>

          <ng-container matColumnDef="stock_actual">
            <th mat-header-cell *matHeaderCellDef>Stock</th>
            <td mat-cell *matCellDef="let x" [class.text-danger]="x.alerta_stock_minimo" [class.fw-bold]="x.alerta_stock_minimo">
              {{ x.stock_actual }}
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-dark text-white"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" id="fila{{row.producto_id}}"></tr>
        </table>
      </div>

      <mat-divider></mat-divider>
      <mat-paginator [pageSizeOptions]="[5, 10, 20]" [pageSize]="20" showFirstLastButtons class="bg-light"></mat-paginator>
    </div>
  </mat-card-content>
</mat-card>
