<mat-card class="my-1" appearance="outlined">

  <mat-card-header class="bg-light d-flex justify-content-between flex-wrap pt-1">
    <mat-card-title class="text-bg-white" style="font-size: 16px;">
      <strong>REPORTE PRODUCTO</strong>
    </mat-card-title>

    <mat-form-field class="col-12 col-md-2 ms-auto me-2">
        <mat-label>Texto búsqueda</mat-label>
        <input matInput type="search" placeholder="" (keydown.enter)="busqueda(txtBusqueda.value)" #txtBusqueda>
        <button mat-icon-button matSuffix class="text-info" (click)="busqueda(txtBusqueda.value)">
          <mat-icon>search</mat-icon>
        </button>
    </mat-form-field>

    <div class="col-12 col-md-1">
      <button mat-button (click)="mostrarVisorPdf('0ms', '0ms')"
        class="bg-danger rounded-button text-white w-100">Pdf</button>
    </div>
  </mat-card-header>

  <mat-card-content class="bg-white p-0">
    <div class="mat-elevation-z8">
      <div class="table-responsive">
        <table mat-table [dataSource]="dataSource">

          <!-- Fila para mostrar "No hay datos disponibles" -->
          <tr *matNoDataRow>
            <td [attr.colspan]="displayedColumns.length" class="text-center" style="font-size:18px;">
              No hay datos disponibles
            </td>
          </tr>

          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>Id</th>
            <td mat-cell *matCellDef="let x"> {{x.id}} </td>
          </ng-container>

          <ng-container matColumnDef="descripcion">
            <th mat-header-cell *matHeaderCellDef>Descripcion</th>
            <td mat-cell *matCellDef="let x"> {{x.descripcion}} </td>
          </ng-container>

          <ng-container matColumnDef="categoria">
            <th mat-header-cell *matHeaderCellDef>Categoria</th>
            <td mat-cell *matCellDef="let x"> {{x.categoria}} </td>
          </ng-container>

          <ng-container matColumnDef="precio">
            <th mat-header-cell *matHeaderCellDef class="text-center">Precio</th>
            <td mat-cell *matCellDef="let x" class="text-center">
              {{x.precio}}
              <mat-icon style="margin-left: 8px;" class="text-primary">money</mat-icon>
            </td>
          </ng-container>

          <ng-container matColumnDef="stock">
            <th mat-header-cell *matHeaderCellDef class="text-center">Stock</th>
            <td mat-cell *matCellDef="let x" class="text-center"> {{x.stock}} </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-dark text-white"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" id="fila{{row.id}}"></tr>

        </table>
      </div>
      <mat-divider></mat-divider>
      <mat-paginator [pageSizeOptions]="[5, 10, 20]" [pageSize]="20" showFirstLastButtons
        class="bg-light"></mat-paginator>
    </div>
  </mat-card-content>
</mat-card>
