<mat-card class="my-1" appearance="outlined">

    <mat-card-header class="bg-light pt-2 pb-2 px-3">
        <div class="row w-100 align-items-center">
            
            <div class="col-12 col-xl-2 col-lg-2 col-md-12 mb-2 mb-lg-0">
                <mat-card-title class="text-bg-white m-0" style="font-size: 15px;">
                    <strong>CUENTAS POR COBRAR</strong>
                </mat-card-title>
            </div>

            <mat-form-field class="col-12 col-xl-2 col-lg-2 col-md-3" subscriptSizing="dynamic">
                <mat-label>Desde</mat-label>
                <input matInput [matDatepicker]="picker_ini" [(ngModel)]="fecha_ini" name="fecha_ini" required>      
                <mat-datepicker-toggle matIconSuffix [for]="picker_ini"></mat-datepicker-toggle>
                <mat-datepicker #picker_ini></mat-datepicker>
            </mat-form-field>
            
            <mat-form-field class="col-12 col-xl-2 col-lg-2 col-md-3" subscriptSizing="dynamic">
                <mat-label>Hasta</mat-label>
                <input matInput [matDatepicker]="picker_fin" [(ngModel)]="fecha_fin" name="fecha_fin" required>      
                <mat-datepicker-toggle matIconSuffix [for]="picker_fin"></mat-datepicker-toggle>
                <mat-datepicker #picker_fin></mat-datepicker>
            </mat-form-field>       

            <mat-form-field class="col-12 col-xl-3 col-lg-3 col-md-3" subscriptSizing="dynamic">
                <mat-label>Buscar</mat-label>
                <input matInput (keyup)="busqueda($any($event.target).value)" placeholder="Buscar en tabla...">
                <mat-icon matSuffix>search</mat-icon>
            </mat-form-field>

            <div class="col-12 col-xl-3 col-lg-3 col-md-3 d-flex gap-2 mt-2 mt-md-0">
                <button mat-button (click)="cargarDatos()" class="bg-primary rounded-button text-white w-50">Filtrar</button>
                <button mat-button (click)="exportarReportePdf()" class="bg-danger rounded-button text-white w-50">
                    PDF <mat-icon>picture_as_pdf</mat-icon>
                </button>
            </div>

        </div>
    </mat-card-header>

    <mat-card-content class="bg-white p-0">
        <div class="mat-elevation-z8">
            <div class="table-responsive">
                <table mat-table [dataSource]="dataSource">

                    <!-- Fila para mostrar "No hay datos disponibles" -->
                    <tr *matNoDataRow>
                        <td [attr.colspan]="displayedColumns.length" class="text-center" style="font-size:18px;">
                            No hay datos disponibles
                        </td>
                    </tr>                    

                    <ng-container matColumnDef="documento">
                        <th mat-header-cell *matHeaderCellDef style="text-align: center;">Documento</th>
                        <td mat-cell *matCellDef="let x" style="text-align: center;">
                            <button mat-icon-button (click)="mostrarVisorPdf(x.id)" title="Imprimir Comprobante">
                                <mat-icon style="color: #f44336;">picture_as_pdf</mat-icon>
                            </button>
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="nro_venta">
                        <th mat-header-cell *matHeaderCellDef>Nro. Venta</th>
                        <td mat-cell *matCellDef="let x"> {{x.nro_venta}} </td>
                    </ng-container>

                    <ng-container matColumnDef="fecha">
                        <th mat-header-cell *matHeaderCellDef>Fecha</th>
                        <td mat-cell *matCellDef="let x"> {{x.fecha}} </td>
                    </ng-container>

                    <ng-container matColumnDef="nro_habitacion">
                        <th mat-header-cell *matHeaderCellDef style="text-align: center;">Nro. Hab.</th>
                        <td mat-cell *matCellDef="let x" style="text-align: center;"> {{x.nro_habitacion}} </td>
                    </ng-container>

                    <ng-container matColumnDef="cliente">
                        <th mat-header-cell *matHeaderCellDef>Cliente</th>
                        <td mat-cell *matCellDef="let x"> {{x.cliente}} </td>
                    </ng-container>

                    <ng-container matColumnDef="observacion">
                        <th mat-header-cell *matHeaderCellDef>Observacion</th>
                        <td mat-cell *matCellDef="let x"> {{x.observacion}} </td>
                    </ng-container>

                    <ng-container matColumnDef="credito">
                        <th mat-header-cell *matHeaderCellDef style="text-align: right;">Crédito</th>
                        <td mat-cell *matCellDef="let x" style="text-align: right;"> {{x.credito}} </td>
                    </ng-container>

                    <ng-container matColumnDef="pagos">
                        <th mat-header-cell *matHeaderCellDef style="text-align: right;">Pagado</th>
                        <td mat-cell *matCellDef="let x" style="text-align: right;"> {{x.pagos}} </td>
                    </ng-container>

                    <ng-container matColumnDef="saldo">
                        <th mat-header-cell *matHeaderCellDef style="text-align: right;">Saldo</th>
                        <td mat-cell *matCellDef="let x" style="text-align: right;"> {{x.saldo}} </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-dark text-white"></tr>
                                        
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;" 
                        id="fila{{row.id}}">
                    </tr>

                </table>
            </div>
            <mat-divider></mat-divider>
            <mat-paginator [pageSizeOptions]="[5, 10, 20]" [pageSize]="20" showFirstLastButtons
                class="bg-light"></mat-paginator>
        </div>      

    </mat-card-content>
</mat-card>
