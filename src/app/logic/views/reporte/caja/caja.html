
<mat-card class="my-1" appearance="outlined">

  <mat-card-header class="bg-light d-flex justify-content-between flex-wrap pt-1">
    <mat-card-title class="text-bg-white" style="font-size: 16px;">
      <strong>REPORTE CAJA</strong>
    </mat-card-title>

    <mat-form-field class="col-12 col-md-2">
        <mat-label>Usuario</mat-label>
        <mat-select placeholder="" [(ngModel)]="usuario_id" name="usuario_id">
            <mat-option [value]="null">Todo</mat-option>
            @for (u of usuarios();track $index) {
              <mat-option [value]="u.id">{{u.nombre_usuario}}</mat-option>
            }
        </mat-select>
    </mat-form-field>
       
    <mat-form-field class="col-12 col-md-2">
        <mat-label>Desde</mat-label>
        <input matInput [matDatepicker]="picker_ini" [(ngModel)]="fecha_ini" name="fecha_ini" #txtFechaIni required>      
        <mat-datepicker-toggle matIconSuffix [for]="picker_ini"></mat-datepicker-toggle>
        <mat-datepicker #picker_ini></mat-datepicker>
    </mat-form-field>

    <mat-form-field class="col-12 col-md-2">
        <mat-label>Hasta</mat-label>
        <input matInput [matDatepicker]="picker_fin" [(ngModel)]="fecha_fin" name="fecha_fin" #txtFechaFin required>      
        <mat-datepicker-toggle matIconSuffix [for]="picker_fin"></mat-datepicker-toggle>
        <mat-datepicker #picker_fin></mat-datepicker>
    </mat-form-field>       

    <div class="col-12 col-md-1">
        <button mat-button (click)="cargarDatos()" class="bg-primary rounded-button text-white w-100">Filtrar</button>
    </div>   

  </mat-card-header>

  <mat-card-content class="bg-white p-0">
      <div class="mat-elevation-z8">
          <div class="table-responsive">
            <table mat-table [dataSource]="dataSource">

                <!-- Fila para mostrar "No hay datos disponibles" -->
                <tr *matNoDataRow>
                  <td [attr.colspan]="displayedColumns.length" class="text-center" style="font-size:18px;">
                    No hay datos disponibles
                  </td>
                </tr>

                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef>Id</th>
                    <td mat-cell *matCellDef="let x"> {{x.id}} </td>
                </ng-container>                               

                <ng-container matColumnDef="usuario">
                    <th mat-header-cell *matHeaderCellDef>Usuario</th>
                    <td mat-cell *matCellDef="let x"><mat-icon style="color: blue; margin-left: 8px;">person</mat-icon> {{x.usuario}}</td>
                </ng-container>                                

                <ng-container matColumnDef="fecha_ini">
                    <th mat-header-cell *matHeaderCellDef>Iniciado</th>
                    <td mat-cell *matCellDef="let x"> {{x.fecha_ini}} </td>
                </ng-container>                

                <ng-container matColumnDef="fecha_fin">
                    <th mat-header-cell *matHeaderCellDef>Finalizado</th>
                    <td mat-cell *matCellDef="let x"> {{x.fecha_fin}} </td>
                </ng-container>

                <ng-container matColumnDef="estado">
                    <th mat-header-cell *matHeaderCellDef>Estado</th>
                    <td mat-cell *matCellDef="let x"> {{x.estado}} </td>
                </ng-container>

                <ng-container matColumnDef="acciones">
                     <th mat-header-cell *matHeaderCellDef>Acciones</th>
                     <td mat-cell *matCellDef="let x">
                       <button mat-raised-button class="bg-info text-black rounded-button" (click)="voucherCierreCaja(x.id)">Detalle</button>                                                  
                     </td>
                </ng-container>               

                <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-dark text-white"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;" id="fila{{row.id}}"></tr>
                
            </table>
          </div>
          <mat-divider></mat-divider>
          <mat-paginator [pageSizeOptions]="[5, 10, 20]" [pageSize]="20" showFirstLastButtons class="bg-light"></mat-paginator>
      </div>
  </mat-card-content>
</mat-card>
