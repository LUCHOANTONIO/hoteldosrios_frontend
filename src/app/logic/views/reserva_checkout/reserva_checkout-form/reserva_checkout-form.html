<form autocomplete="off" (ngSubmit)="submit(f)" #f="ngForm" appPreventEnterSubmit>

    <h1 mat-dialog-title cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle class="text-bg-dark dialog-header">
      CHECK OUT
      <button mat-icon-button mat-dialog-close>
        <mat-icon style="color:white">close</mat-icon>
      </button>
    </h1>

   <mat-dialog-content class="mat-typography">
      <div class="row pt-2">
        
        <div class="col-12 col-md-6 mb-2">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Cliente</mat-label>
            <input matInput [(ngModel)]="reserva_checkout.cliente" name="cliente" 
                  #txtCliente (keydown.enter)="txtHabitacion.focus()" readonly required>
          </mat-form-field>
        </div>

        <div class="col-12 col-md-6 mb-2">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Habitación</mat-label>
            <input matInput [(ngModel)]="reserva_checkout.habitacion" name="habitacion" 
                  #txtHabitacion (keydown.enter)="txtFechaSalida.focus()" readonly required>
          </mat-form-field>
        </div>

        <div class="col-12 col-md-6 mb-2">
          <!-- <mat-form-field appearance="outline" class="w-100">
            <mat-label>Fecha Salida</mat-label>
            <input matInput [(ngModel)]="reserva_checkout.fecha_fin" name="fecha_fin" (keydown.enter)="txtHoraSalida.focus()" #txtFechaSalida required>
          </mat-form-field> -->

          <mat-form-field appearance="outline" class="w-100 compact-f" subscriptSizing="dynamic">
              <mat-label>Fecha Salida</mat-label>
              <input matInput [matDatepicker]="picker_fin" [(ngModel)]="reserva_checkout.fecha_fin" name="fecha_fin" #txtFechaSalida>
              <mat-datepicker-toggle matIconSuffix [for]="picker_fin"></mat-datepicker-toggle>
              <mat-datepicker #picker_fin></mat-datepicker>
          </mat-form-field>
        </div>

        <div class="col-12 col-md-6 mb-2">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Hora Salida</mat-label>
            <input matInput type="time" [(ngModel)]="reserva_checkout.hora_fin" name="hora_fin" 
                  #txtHoraSalida required>
          </mat-form-field>
        </div>

      </div>
    </mat-dialog-content>

    <mat-dialog-actions class="d-flex justify-content-around bg-light">
        <button mat-raised-button mat-dialog-close class="bg-primary text-white">Cancelar</button>
        <button mat-raised-button type="submit" class="bg-success text-black" appBotonGuardar [form]="f"><mat-icon class="d-none"><mat-spinner  diameter="18"></mat-spinner> </mat-icon> Guardar </button>
    </mat-dialog-actions>

</form>
