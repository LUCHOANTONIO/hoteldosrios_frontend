<mat-card class="my-1" appearance="outlined">

    <mat-card-header class="header-compacto bg-light row align-items-center m-0 p-1">

        <div class="col-12 col-md-3 d-flex align-items-center justify-content-center justify-content-md-start">
            <mat-card-title class="text-bg-white pt-1" style="font-size: 18px; font-weight: bold;">
                CHECK OUT
            </mat-card-title>
        </div>

        <!-- <div class="col-12 col-md-4 d-flex justify-content-center my-2 my-md-0">
            <button mat-raised-button class="bg-primary rounded-button text-white w-20"
                (click)="actualizarCheckOut()">Actualizar Check Out</button>
        </div> -->

        <div class="col-12 col-md-3 ms-auto d-flex justify-content-center justify-content-md-end">
            <mat-form-field appearance="outline" class="w-100 compact-f search-box" subscriptSizing="dynamic">
                <mat-label>Buscar...</mat-label>
                <input matInput type="search" (keydown.enter)="busqueda(txtBusqueda.value)" #txtBusqueda>
                <mat-icon matSuffix class="text-info" style="cursor: pointer;"
                    (click)="busqueda(txtBusqueda.value)">search</mat-icon>
            </mat-form-field>
        </div>

    </mat-card-header>

    <mat-card-content class="bg-white p-0">
        <div class="mat-elevation-z8">
            <div class="table-responsive">
                <table mat-table [dataSource]="dataSource">

                    <!-- Fila para mostrar "No hay datos disponibles" -->
                    <tr *matNoDataRow>
                        <td [attr.colspan]="displayedColumns.length" class="text-center" style="font-size:18px;">
                            No hay datos disponibles
                        </td>
                    </tr>

                    <ng-container matColumnDef="id">
                        <th mat-header-cell *matHeaderCellDef>Id </th>
                        <td mat-cell *matCellDef="let x"> {{x.id}} </td>
                    </ng-container>

                    <ng-container matColumnDef="cliente">
                        <th mat-header-cell *matHeaderCellDef> Cliente </th>
                        <td mat-cell *matCellDef="let x">
                            <div style="display: flex; align-items: center;">
                                {{x.cliente}}
                            </div>
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="habitacion">
                        <th mat-header-cell *matHeaderCellDef>Habitacion</th>
                        <td mat-cell *matCellDef="let x"> {{x.habitacion}} </td>
                    </ng-container>

                    <ng-container matColumnDef="sucursal">
                        <th mat-header-cell *matHeaderCellDef> Sucursal </th>
                        <td mat-cell *matCellDef="let x">
                            <div style="display: flex; align-items: center;">
                                <span>{{ x.sucursal }}</span>
                            </div>
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="fecha_fin">
                        <th mat-header-cell *matHeaderCellDef> Fecha Salida </th>
                        <td mat-cell *matCellDef="let x">
                            <div style="display: flex; align-items: center;">
                                <span>{{ x.fecha_checkout }}</span>
                            </div>
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="hora_fin">
                        <th mat-header-cell *matHeaderCellDef> Hora Salida </th>
                        <td mat-cell *matCellDef="let x">
                            <div style="display: flex; align-items: center;">
                                {{ x.hora_fin }}
                                <mat-icon style="margin-left: 8px;color: blue">access_time</mat-icon>
                            </div>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-dark text-white"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;" id="fila{{row.id}}"></tr>

                </table>
            </div>
            <mat-divider></mat-divider>
            <mat-paginator [pageSizeOptions]="[5, 10, 20,30]" [pageSize]="30" showFirstLastButtons class="bg-light">
            </mat-paginator>
        </div>
    </mat-card-content>
</mat-card>
