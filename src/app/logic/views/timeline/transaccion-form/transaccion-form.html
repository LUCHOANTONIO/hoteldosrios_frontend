<form autocomplete="off" #transaccionForm="ngForm" appPreventEnterSubmit AnimarPerderFocoDirective>                        
    <div id="data_transaccion" class="container">
        <mat-dialog-content class="mat-typography"> 
            <div class="row row-cols-1 row-cols-md-2">  
                <app-select-search class="col"
                    #cboPaisProcedencia
                    (keyupEnter)="cboProducto.focus()"
                    label="Categoria"      
                    [(ngModel)]="transaccion.categoria_id" 
                    [dataSource]="categorias" 
                    (selectionChange)="filtrarProductos()"
                    text="descripcion"
                    value="id"
                    name="categoria_id"
                    showCleanButton="false"
                    required
                    [searchFields]="['descripcion']"            
                    >                       
                </app-select-search>                               

                <app-select-search class="col"
                    #cboProducto
                    (keyupEnter)="txtCantidad.focus()"
                    label="Productos"      
                    [(ngModel)]="transaccion.producto_id" 
                    [dataSource]="productos_filtrados" 
                    (selectionChange)="{}"
                    text="descripcion"
                    value="id"
                    name="producto_id"
                    showCleanButton="false"
                    required
                    [searchFields]="['descripcion']"            
                    (selectionChange)="onSelectionChange($event)">                       
                </app-select-search>             
                
        
                <mat-form-field class="col">
                    <mat-label>Cantidad</mat-label>
                    <input matInput type="number" min="1" step="1" placeholder="" [(ngModel)]="transaccion.cantidad" name="cantidad" #txtCantidad (ngModelChange)="calcularTotal()" required>
                </mat-form-field>
        
                <mat-form-field class="col">
                    <mat-label>Precio Unidad</mat-label>
                    <input matInput type="number" min="0.01" step="1" placeholder="" [(ngModel)]="transaccion.precio_unitario" name="precio_unitario" #txtMonto (input)="calcularTotal()" required>
                </mat-form-field> 

                <mat-form-field class="col">
                    <mat-label>Total</mat-label>
                    <input matInput type="number" placeholder="" [(ngModel)]="transaccion.total" name="total" #txtTotal readonly required>
                </mat-form-field>
                
                <button mat-raised-button type="button" #btnGuardarHuesped class="bg-success text-black rounded-button" (click)="submitTransaccion(transaccionForm)" appBotonGuardar  [form]="transaccionForm">
                    <mat-icon class="d-none"><mat-spinner diameter="18"></mat-spinner></mat-icon>Procesar
                </button>
            </div>                                               
        </mat-dialog-content>
                                
    </div>
    
    <div class="container">
        <div class="row">
            <div class="col-12">
              <div class="table-responsive"> 
                <table mat-table [dataSource]="dataSourceTransaccion" class="mat-elevation-z8 w-100">
                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef> Acciones </th>
                        <td mat-cell *matCellDef="let transaccionData">                       
                           <button mat-icon-button [hidden]="!mostrar_btn_destroy" class="text-danger" (click)="eliminarTransaccion('0ms', '0ms',transaccionData)"><mat-icon>delete</mat-icon></button>
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="id">
                        <th mat-header-cell *matHeaderCellDef>Id</th>
                        <td mat-cell *matCellDef="let transaccionData"> {{ transaccionData.id}} </td>
                    </ng-container>

                    <ng-container matColumnDef="fecha">
                        <th mat-header-cell *matHeaderCellDef>Fecha</th>
                        <td mat-cell *matCellDef="let transaccionData"> {{ transaccionData.fecha}} </td>
                    </ng-container>
            
                    <ng-container matColumnDef="descripcion">
                        <th mat-header-cell *matHeaderCellDef>Descripcion</th>
                        <td mat-cell *matCellDef="let transaccionData"> {{ transaccionData.descripcion}} </td>
                    </ng-container>
            
                    <ng-container matColumnDef="cantidad">
                        <th mat-header-cell *matHeaderCellDef>Cant</th>
                        <td mat-cell *matCellDef="let transaccionData"> {{ transaccionData.cantidad}} </td>
                    </ng-container>
            
                    <ng-container matColumnDef="precio_unitario">
                        <th mat-header-cell *matHeaderCellDef>P/u</th>
                        <td mat-cell *matCellDef="let transaccionData"> {{ transaccionData.precio_unitario}} </td>
                    </ng-container>
                    
                    <ng-container matColumnDef="total">
                        <th mat-header-cell *matHeaderCellDef>Total</th>
                        <td mat-cell *matCellDef="let transaccionData"> {{ transaccionData.total}} </td>
                    </ng-container>
            
                    <tr mat-header-row *matHeaderRowDef="displayedColumnsTransaccion" class="bg-light"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumnsTransaccion;"></tr>
                </table>             
            </div>
        
            <mat-divider></mat-divider>
            <mat-paginator [pageSizeOptions]="[5, 10, 20]" [pageSize]="20" showFirstLastButtons class="bg-light"></mat-paginator>
          </div>
        </div>
    </div>
                                  
</form>
