<div class="timeline-page">
  <!-- BARRA DE PESTAÑAS Y ACCIONES -->
  <div class="timeline-header-bar">
    <div class="timeline-tabs" role="tablist" aria-label="Divisiones de servicios">
      <button 
        type="button" 
        role="tab"
        class="timeline-tab tab-habitaciones" 
        [class.active]="tabActiva === 'habitaciones'"
        [attr.aria-selected]="tabActiva === 'habitaciones'"
        (click)="cambiarTab('habitaciones')">
        <span class="tab-content">
          <mat-icon class="tab-icon">hotel</mat-icon>
          <span class="tab-title">Habitaciones</span>
        </span>
        <span class="tab-badge">{{ countHabitaciones }}</span>
      </button>

      <button 
        type="button" 
        role="tab"
        class="timeline-tab tab-fullday" 
        [class.active]="tabActiva === 'fullday'"
        [attr.aria-selected]="tabActiva === 'fullday'"
        (click)="cambiarTab('fullday')">
        <span class="tab-content">
          <mat-icon class="tab-icon">wb_sunny</mat-icon>
          <span class="tab-title">{{ labelFullDay }}</span>
        </span>
        <span class="tab-badge">{{ countFullDay }}</span>
      </button>

      <button 
        type="button" 
        role="tab"
        class="timeline-tab tab-camping" 
        [class.active]="tabActiva === 'camping'"
        [attr.aria-selected]="tabActiva === 'camping'"
        (click)="cambiarTab('camping')">
        <span class="tab-content">
          <mat-icon class="tab-icon">forest</mat-icon>
          <span class="tab-title">{{ labelCamping }}</span>
        </span>
        <span class="tab-badge">{{ countCamping }}</span>
      </button>

      <button 
        type="button" 
        role="tab"
        class="timeline-tab tab-todas" 
        [class.active]="tabActiva === 'todas'"
        [attr.aria-selected]="tabActiva === 'todas'"
        (click)="cambiarTab('todas')">
        <span class="tab-content">
          <mat-icon class="tab-icon">view_list</mat-icon>
          <span class="tab-title">Todas</span>
        </span>
        <span class="tab-badge">{{ countTodas }}</span>
      </button>
    </div>

    <div class="timeline-actions">
      <button type="button" class="action-btn btn-alimentos" (click)="irAlimentos()" matTooltip="Acceso directo a Servicio de Alimentos">
        <mat-icon>restaurant</mat-icon>
        <span>Alimentos</span>
      </button>
      <button type="button" class="action-btn" (click)="centrarTimelineEnHoy()" matTooltip="Centrar calendario en la fecha de hoy">
        <mat-icon>today</mat-icon>
        <span>Hoy</span>
      </button>
      <button type="button" class="action-btn btn-primary" (click)="mostrarIrFecha('0ms', '0ms')" matTooltip="Ir a una fecha específica">
        <mat-icon>calendar_month</mat-icon>
        <span>Ir a Fecha</span>
      </button>
    </div>
  </div>

  <!-- CONTENEDOR DEL CALENDARIO -->
  <div class="timeline-wrapper"> 
    <div class="timeline-container" #timelineContainer></div>
  </div>
</div>

<!-- MENÚ RÁPIDO DE ESTADO DE HABITACIÓN (CLICK DERECHO EN HABITACIÓN) -->
<div 
  *ngIf="menuEstadoVisible && habitacionMenuSeleccionada"
  class="room-status-context-menu"
  [style.top]="menuEstadoTop"
  [style.left]="menuEstadoLeft"
  (click)="$event.stopPropagation()"
  (contextmenu)="$event.preventDefault(); $event.stopPropagation()">
  
  <div class="room-status-header">
    <div class="room-status-title-row">
      <mat-icon class="room-door-icon">meeting_room</mat-icon>
      <span class="room-title-text">Habitación {{ habitacionMenuSeleccionada.nro_habitacion }}</span>
    </div>
    <div class="room-status-subtitle">
      {{ (habitacionMenuSeleccionada.tipo_habitacion || habitacionMenuSeleccionada.descripcion) | uppercase }} • Piso {{ habitacionMenuSeleccionada.piso }}
    </div>
  </div>

  <div class="room-status-body">
    <div class="room-status-section-label">CAMBIAR ESTADO:</div>
    <div class="room-status-list">
      <button
        type="button"
        *ngFor="let estado of estado_habitaciones"
        class="room-status-item"
        [class.active]="isEstadoActualHabitacion(estado)"
        [disabled]="cambiandoEstadoHabitacion"
        (click)="cambiarEstadoHabitacionRapido(estado)">
        <mat-icon *ngIf="isEstadoActualHabitacion(estado)" class="status-check-icon">check</mat-icon>
        <span class="status-dot" [style.background-color]="getColorEstadoMenuDot(estado)"></span>
        <span class="status-label">{{ estado.descripcion }}</span>
      </button>
    </div>
  </div>
</div>

<app-context-menu #contextMenu [selectedItems]="selectedItems" [items]="items"></app-context-menu>
