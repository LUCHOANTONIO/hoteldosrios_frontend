<form autocomplete="off" (ngSubmit)="submitAgrupar(f)" #f="ngForm">

    <h1 mat-dialog-title cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle class="text-bg-dark dialog-header">
      AGRUPAR RESERVA
      <button mat-icon-button mat-dialog-close>
        <mat-icon style="color:white">close</mat-icon>
      </button>
    </h1>

    <mat-dialog-content class="mat-typography row row-cols-1 px-0 pt-2">               
        <mat-form-field class="col-12">
            <mat-label>Nombre</mat-label>
            <input matInput placeholder="" [(ngModel)]="grupo.nombre" name="nombre" #txtNombre cdkFocusInitial required>
        </mat-form-field> 
        
        <div class="row">
            <div class="col-12">
                <div class="table-responsive"> 
                    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 w-100"> 

                        <!-- Fila para mostrar "No hay datos disponibles" -->
                        <tr *matNoDataRow>
                            <td [attr.colspan]="displayedColumns.length" class="text-center" style="font-size:18px;">
                            No hay datos disponibles
                            </td>
                        </tr>

                        <ng-container matColumnDef="id">
                            <th mat-header-cell *matHeaderCellDef>Id</th>
                            <td mat-cell *matCellDef="let data"> {{ data.id}} </td>
                        </ng-container>
                
                        <ng-container matColumnDef="correlativo">
                            <th mat-header-cell *matHeaderCellDef>Reserva</th>
                            <td mat-cell *matCellDef="let data"> {{ data.correlativo}} </td>
                        </ng-container>                       
                
                        <ng-container matColumnDef="nro_habitacion">
                            <th mat-header-cell *matHeaderCellDef>Nro Hab.</th>
                            <td mat-cell *matCellDef="let data"> {{ data.nro_habitacion}} </td>
                        </ng-container>
                        
                        <ng-container matColumnDef="estado">
                            <th mat-header-cell *matHeaderCellDef>Estado</th>
                            <td mat-cell *matCellDef="let data"> {{ data.estado}} </td>
                        </ng-container>

                         <ng-container matColumnDef="actions">
                            <th mat-header-cell *matHeaderCellDef>Acciones</th>
                            <td mat-cell *matCellDef="let data">                            
                            <button type="button" mat-icon-button class="text-danger" (click)="eliminar(data)"><mat-icon>delete</mat-icon></button>
                            </td>
                        </ng-container>
                
                        <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-light"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                    </table>
                </div>
                            
                <mat-paginator [pageSizeOptions]="[5, 10, 20]" [pageSize]="20" showFirstLastButtons class="bg-light"></mat-paginator>
            </div>
        </div>

    </mat-dialog-content>

    <mat-dialog-actions class="d-flex justify-content-around bg-light">
        <button mat-raised-button type="button" [mat-dialog-close]="null" class="bg-primary text-white">Cancelar</button>       
        <button mat-raised-button type="submit" class="bg-success text-black" appBotonGuardar [form]="f"><mat-icon class="d-none"><mat-spinner  diameter="18"></mat-spinner> </mat-icon>Guardar</button>
    </mat-dialog-actions>
    
</form>
