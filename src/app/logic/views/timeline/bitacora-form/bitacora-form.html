<form autocomplete="off" #notaForm="ngForm" appPreventEnterSubmit AnimarPerderFocoDirective>   
    <mat-dialog-content class="mat-typography"> 
               
      <div class="timeline">
        @for (bitacora of bitacoras; track bitacora.id) {
          <div class="timeline-item">
            <div class="timeline-line"></div>
            <div class="timeline-dot">
              <mat-icon>circle</mat-icon> 
            </div>
            <mat-card class="timeline-content">
              <mat-card-header>
                <strong>{{ bitacora.usuario }} :</strong>  {{ bitacora.fecha }}
              </mat-card-header>
              <mat-card-content>
                <p><strong>{{bitacora.titulo}}</strong></p>
                <p class="descripcion">{{ bitacora.descripcion1 }}</p>
                <p class="descripcion">{{ bitacora.descripcion2 }}</p>
                <p class="descripcion">{{ bitacora.descripcion3 }}</p>
              </mat-card-content>
            </mat-card>
          </div>
        }
      </div>
                             
    </mat-dialog-content>  
    
    <mat-dialog-actions class="d-flex justify-content-around bg-light">                          
    </mat-dialog-actions> 
  
  </form>
