<form autocomplete="off" (ngSubmit)="submit(f)" #f="ngForm" appPreventEnterSubmit appAnimarPerderFoco
    [dialogRef]="dialogRef">

    <h1 mat-dialog-title cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle
        class="text-bg-dark dialog-header">
        INVENTARIO
        <button mat-icon-button mat-dialog-close>
            <mat-icon style="color:white">close</mat-icon>
        </button>
    </h1>

    <mat-dialog-content class="mat-typography row row-cols-1 row-cols-md-2 px-0 pt-2">

        <mat-form-field class="col">
            <mat-label>Producto</mat-label>
            <mat-select placeholder="" [(ngModel)]="inventario.producto_id" name="producto_id" #cboProducto
                appPreventEnterSelect (keydown.enter)="txtCantidad.focus()" required>
                @for (x of productos;track $index) {
                <mat-option [value]="x.id">{{x.descripcion}}</mat-option>
                }
            </mat-select>
        </mat-form-field>

        <mat-form-field class="col">
            <mat-label>Cantidad</mat-label>
            <input type="number" matInput placeholder="" [(ngModel)]="inventario.cantidad" name="cantidad" #txtCantidad
                required>
        </mat-form-field>

    </mat-dialog-content>

    <mat-dialog-actions class="d-flex justify-content-around bg-light">
        <button mat-raised-button mat-dialog-close class="bg-primary text-white">Cancelar</button>
        <button mat-raised-button type="submit" class="bg-success text-black" appBotonGuardar [form]="f"><mat-icon
                class="d-none"><mat-spinner diameter="18"></mat-spinner> </mat-icon>Guardar</button>
    </mat-dialog-actions>

</form>
