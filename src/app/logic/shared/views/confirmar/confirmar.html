<h3 mat-dialog-title  cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle class="bg-primary text-white">CONFIRMAR</h3>
<mat-dialog-content class="mat-typography">
    <span>  {{title}}</span>
</mat-dialog-content>

<mat-dialog-actions class="d-flex justify-content-around">
  <button mat-raised-button mat-dialog-close color="accent">Cancelar</button>
  <button mat-raised-button [mat-dialog-close]="true" cdkFocusInitial color="warn">Aceptar</button>
</mat-dialog-actions>
